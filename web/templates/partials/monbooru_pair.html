{{define "monbooru_pair"}}
<div id="monbooru-pair"{{if .Waiting}} hx-post="/settings/monbooru/pair/poll" hx-trigger="every 2s [!confirmOpen()]" hx-swap="outerHTML"{{end}}>
  {{if .Waiting}}
  <p class="field-hint">Waiting... Approve the request in Mebooru, under Settings &gt; Plugins.
    <form hx-post="/settings/monbooru/pair/cancel" hx-target="#monbooru-pair" hx-swap="outerHTML" style="display:inline">
      <button type="submit">Cancel</button>
    </form>
  </p>
  {{else if .Paired}}
  <p class="field-hint">Connected to Mebooru.
    <form hx-post="/settings/monbooru/pair/connect" hx-target="#monbooru-pair" hx-swap="outerHTML" style="display:inline">
      <button type="submit" class="peer-accent">Pair again</button>
    </form>
    <form hx-post="/settings/monbooru/pair/remove" hx-target="#monbooru-pair" hx-swap="outerHTML"
          hx-confirm="Remove the Mebooru pairing?" data-confirm-ok="Remove"
          data-confirm-danger="You will need to pair again before Meloader can send images." style="display:inline">
      <button type="submit" class="btn-danger">Remove pairing</button>
    </form>
  </p>
  {{else}}
  <p class="field-hint">Click Connect, then approve the request in Mebooru, under Settings &gt; Plugins.</p>
  <form hx-post="/settings/monbooru/pair/connect" hx-target="#monbooru-pair" hx-swap="outerHTML" style="display:inline">
    <button type="submit" class="peer-accent">Connect to Mebooru</button>
  </form>
  {{end}}
  {{if .Message}} <span class="field-hint">{{.Message}}</span>{{end}}
</div>
{{end}}
