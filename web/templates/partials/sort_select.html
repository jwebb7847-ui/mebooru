{{define "partials/sort_select.html"}}
<span id="search-sort-controls"{{if .OOB}} hx-swap-oob="true"{{end}}>
  {{$sort := or .Sort "newest"}}
  {{$order := or .Order (defaultSortOrder $sort)}}
  <select id="search-sort" aria-label="Sort" onchange="applySortChange(this)">
    {{range sortChoices .Query $sort}}
    <option value="{{.Sort}}:{{.Order}}"{{if and (eq .Sort $sort) (or (eq .Order $order) (eq .Sort "random"))}} selected{{end}}>{{.Label}}</option>
    {{end}}
  </select>
  <input type="hidden" name="sort" value="{{$sort}}">
  <input type="hidden" name="order" value="{{$order}}">
  {{if and (eq $sort "random") .Seed}}<input type="hidden" name="seed" value="{{.Seed}}">{{end}}
</span>
{{end}}
