name: Consolidated CodeQL

on:
  push:
    branches: [mebooru-foundation]
    paths-ignore:
      - 'MEBOORU.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - 'docs/project/backlog.md'
      - 'docs/project/bundled-pairing.md'
      - 'docs/project/handoff.md'
      - 'docs/project/unified-product-direction.md'
      - 'docs/validation/mac-acceptance-2026-11-24.md'
      - 'docs/validation/mac-visual-acceptance-2026-11-25.md'
      - 'meloader/README.md'
      - 'meloader/CONTRIBUTING.md'
      - 'meloader/ROADMAP.md'
      - 'meloader/docs/project/handoff.md'
      - 'meloader/docs/validation/local-audit.md'
      - 'packaging/README.md'
      - 'meloader/packaging/README.md'
  pull_request:
    branches: [mebooru-foundation]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - 'MEBOORU.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - 'docs/project/backlog.md'
      - 'docs/project/bundled-pairing.md'
      - 'docs/project/handoff.md'
      - 'docs/project/unified-product-direction.md'
      - 'docs/validation/mac-acceptance-2026-11-24.md'
      - 'docs/validation/mac-visual-acceptance-2026-11-25.md'
      - 'meloader/README.md'
      - 'meloader/CONTRIBUTING.md'
      - 'meloader/ROADMAP.md'
      - 'meloader/docs/project/handoff.md'
      - 'meloader/docs/validation/local-audit.md'
      - 'packaging/README.md'
      - 'meloader/packaging/README.md'
  workflow_dispatch:

# Cancel only older revisions of the same PR/ref and event type.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Analyze both Go modules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: go
          build-mode: manual
      - name: Build both independent modules for extraction
        run: |
          go build -a ./...
          (cd meloader && go build -a ./...)
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: '/language:go'

  non-go:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, c-cpp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: '/language:${{ matrix.language }}'
