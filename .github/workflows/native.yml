        run: |
          go test -race -timeout 30m ./...
          go vet ./...
      - name: Mebooru race and vet
        run: |
          go test -race -timeout 30m ./...
          go vet ./...
      - name: Meloader race and vet
        working-directory: meloader
        run: |
          go test -race -timeout 30m ./...
          go vet ./...
      - name: Strict download regression with pinned gallery-dl
        working-directory: meloader
        shell: bash
        run: |
          source packaging/pins.env
          venv="$RUNNER_TEMP/meloader-strict-gallery-dl"
          python3 -m venv "$venv"
          "$venv/bin/python3" -m pip install --disable-pip-version-check "gallery-dl==$GDL_VERSION"
          test "$("$venv/bin/gallery-dl" --version)" = "$GDL_VERSION"
