            go test -race -count=1 -timeout=3m -v \
              -run '^TestStrictBlacklistGalleryDLMediaBoundary$' ./internal/pipeline

      - name: Audit common source and dependency resolution
        run: python3 .github/qa/consolidation-audit.py

  container-build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: Container build stage (${{ matrix.app }})
    runs-on: ubuntu-24.04
