name: Native verification

on:
  push:
    branches: [mebooru-foundation]
    paths-ignore:
      - 'MEBOORU.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - 'docs/project/backlog.md'
      - 'docs/project/bundled-pairing.md'
      - 'docs/project/handoff.md'
      - 'docs/project/unified-product-direction.md'
      - 'docs/validation/mac-acceptance-2026-11-24.md'
      - 'docs/validation/mac-visual-acceptance-2026-11-25.md'
      - 'meloader/README.md'
      - 'meloader/CONTRIBUTING.md'
      - 'meloader/ROADMAP.md'
      - 'meloader/docs/project/handoff.md'
      - 'meloader/docs/validation/local-audit.md'
      - 'packaging/README.md'
      - 'meloader/packaging/README.md'
  pull_request:
    branches: [mebooru-foundation]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - 'MEBOORU.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - 'docs/project/backlog.md'
      - 'docs/project/bundled-pairing.md'
      - 'docs/project/handoff.md'
      - 'docs/project/unified-product-direction.md'
      - 'docs/validation/mac-acceptance-2026-11-24.md'
      - 'docs/validation/mac-visual-acceptance-2026-11-25.md'
      - 'meloader/README.md'
      - 'meloader/CONTRIBUTING.md'
      - 'meloader/ROADMAP.md'
      - 'meloader/docs/project/handoff.md'
      - 'meloader/docs/validation/local-audit.md'
      - 'packaging/README.md'
      - 'meloader/packaging/README.md'
  workflow_dispatch:

# Cancel only older revisions of the same PR/ref and event type.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOWORK: 'off'

jobs:
  development:
    name: Fast development verification
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            meloader/go.sum
            shared/go.sum
      - name: Test all modules (no live-site tests)
        run: |
          go test -timeout 5m ./...
          (cd meloader && go test -timeout 5m ./...)
          (cd shared && go test -timeout 5m ./...)

      - name: Verify isolated staging cases
        if: github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'worker/operation-migration'
        run: go test -count=1 -v -timeout 5m ./internal/acquisitionstage

      - name: Verify private executable probe (no acquisition)
        env:
          MEBOORU_PROBE_PINNED_RUNTIME: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'worker/operation-migration' && '1' || '0' }}
          MEBOORU_PROBE_STANDALONE_RUNTIME: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'worker/operation-migration' && '1' || '0' }}
        run: python3 .github/qa/managed-probe.py

      - name: Audit common source and dependency resolution
        run: python3 .github/qa/consolidation-audit.py

  worker-windows-development:
    # Temporary targeted intermediate verification for II.6.4 transport.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'worker/operation-migration'
    name: Managed worker Windows development gate
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            meloader/go.sum
            shared/go.sum
      - name: Test ownership and protocol transport
        run: |
          go test -count=1 -timeout 3m ./internal/acquisitionpolicy ./cmd/monbooru
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -v -timeout 3m ./internal/library
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd shared
          go test -count=1 -timeout 3m ./processguard ./workerproto ./acquisitionplan ./contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd ../meloader
          go test -count=1 -timeout 3m ./internal/gdl ./internal/taxonomy ./internal/pipeline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify private executable probe (no acquisition)
        env:
          MEBOORU_PROBE_PINNED_RUNTIME: '1'
          MEBOORU_PROBE_STANDALONE_RUNTIME: '1'
        run: python .github/qa/managed-probe.py

  worker-windows-staging-development:
    # Keep every isolated staging test, but run the slow independent
    # reclamation fixtures concurrently rather than behind the runtime probe.
    # All shards are required development evidence; full native acceptance
    # still runs the complete modules and is not replaced by this gate.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'worker/operation-migration'
    name: Managed staging Windows (${{ matrix.group }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [baseline, workspace, prepared, sealed, closure]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            meloader/go.sum
            shared/go.sum
      - name: Verify exact isolated staging test partition
        env:
          STAGING_TEST_GROUP: ${{ matrix.group }}
        shell: pwsh
        run: |
          $listed = @(go test -list '^(Test|Fuzz|Example)' ./internal/acquisitionstage)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $all = @($listed | Where-Object { $_ -match '^(Test|Fuzz|Example)\S*    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: Native core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            meloader/go.sum
            shared/go.sum
      - name: Test, build and run both apps
        run: python .github/qa/native-smoke.py
      - name: Verify private executable probe (no acquisition)
        run: python .github/qa/managed-probe.py
      - name: Compile Linux tray variants
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libgtk-3-dev libayatana-appindicator3-dev
          CGO_ENABLED=1 go build -mod=readonly -tags tray -o "$RUNNER_TEMP/monbooru-tray" ./cmd/monbooru
          (cd meloader && CGO_ENABLED=1 go build -mod=readonly -tags tray -o "$RUNNER_TEMP/monloader-tray" ./cmd/monloader)
      - name: Build and sign macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: sh packaging/build-macos-app.sh
      - name: Verify the bundled companion lifecycle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$PWD/dist/Mebooru.app"
          export HOME="$RUNNER_TEMP/mebooru-smoke-home"
          mkdir -p "$HOME"
          "$app/Contents/MacOS/monbooru" -no-browser >"$RUNNER_TEMP/mebooru-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/mebooru-smoke.log"' EXIT
          for port in 8455 8456; do
            for attempt in {1..30}; do
              if curl --fail --silent --max-time 2 "http://127.0.0.1:$port/health"; then break; fi
              kill -0 "$pid"
              sleep 1
            done
            curl --fail --silent --max-time 3 "http://127.0.0.1:$port/health"
          done
          curl -fsS --max-time 3 -D "$RUNNER_TEMP/meloader-headers" -o /dev/null 'http://127.0.0.1:8456/settings'
          grep -Fi 'frame-ancestors http://127.0.0.1:8455' "$RUNNER_TEMP/meloader-headers"
          kill -TERM "$pid"
          wait "$pid"
          if curl --fail --silent --max-time 3 'http://127.0.0.1:8456/health'; then
            echo 'Companion outlived Mebooru' >&2
            exit 1
          fi
      - name: Verify first-party pairing and refusal paths
        if: runner.os == 'macOS'
        run: python .github/qa/bundled-pairing-smoke.py dist/Mebooru.app

  go-validation:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: Both modules (race, vet and strict transfer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
