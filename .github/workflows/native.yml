name: Native verification

on:
  push:
    branches: [mebooru-foundation]
    paths-ignore:
      - 'MEBOORU.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - 'docs/project/backlog.md'
      - 'docs/project/bundled-pairing.md'
      - 'docs/project/handoff.md'
      - 'docs/project/unified-product-direction.md'
      - 'docs/validation/mac-acceptance-2026-11-24.md'
      - 'docs/validation/mac-visual-acceptance-2026-11-25.md'
      - 'meloader/README.md'
      - 'meloader/CONTRIBUTING.md'
      - 'meloader/ROADMAP.md'
      - 'meloader/docs/project/handoff.md'
      - 'meloader/docs/validation/local-audit.md'
      - 'packaging/README.md'
      - 'meloader/packaging/README.md'
  pull_request:
    branches: [mebooru-foundation]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - 'MEBOORU.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - 'docs/project/backlog.md'
      - 'docs/project/bundled-pairing.md'
      - 'docs/project/handoff.md'
      - 'docs/project/unified-product-direction.md'
      - 'docs/validation/mac-acceptance-2026-11-24.md'
      - 'docs/validation/mac-visual-acceptance-2026-11-25.md'
      - 'meloader/README.md'
      - 'meloader/CONTRIBUTING.md'
      - 'meloader/ROADMAP.md'
      - 'meloader/docs/project/handoff.md'
      - 'meloader/docs/validation/local-audit.md'
      - 'packaging/README.md'
      - 'meloader/packaging/README.md'
  workflow_dispatch:

# Cancel only older revisions of the same PR/ref and event type.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOWORK: 'off'

jobs:
  development:
    name: Fast development verification
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            meloader/go.sum
            shared/go.sum
      - name: Test all modules (no live-site tests)
        run: |
          go test -timeout 5m ./...
          (cd meloader && go test -timeout 5m ./...)
          (cd shared && go test -timeout 5m ./...)

  native:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: Native core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            meloader/go.sum
            shared/go.sum
      - name: Test, build and run both apps
        run: python .github/qa/native-smoke.py
      - name: Compile Linux tray variants
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libgtk-3-dev libayatana-appindicator3-dev
          CGO_ENABLED=1 go build -mod=readonly -tags tray -o "$RUNNER_TEMP/monbooru-tray" ./cmd/monbooru
          (cd meloader && CGO_ENABLED=1 go build -mod=readonly -tags tray -o "$RUNNER_TEMP/monloader-tray" ./cmd/monloader)
      - name: Build and sign macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: sh packaging/build-macos-app.sh
      - name: Verify the bundled companion lifecycle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$PWD/dist/Mebooru.app"
          export HOME="$RUNNER_TEMP/mebooru-smoke-home"
          mkdir -p "$HOME"
          "$app/Contents/MacOS/monbooru" -no-browser >"$RUNNER_TEMP/mebooru-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/mebooru-smoke.log"' EXIT
          for port in 8455 8456; do
            for attempt in {1..30}; do
              if curl --fail --silent --max-time 2 "http://127.0.0.1:$port/health"; then break; fi
              kill -0 "$pid"
              sleep 1
            done
            curl --fail --silent --max-time 3 "http://127.0.0.1:$port/health"
          done
          curl -fsS --max-time 3 -D "$RUNNER_TEMP/meloader-headers" -o /dev/null 'http://127.0.0.1:8456/settings'
          grep -Fi 'frame-ancestors http://127.0.0.1:8455' "$RUNNER_TEMP/meloader-headers"
          kill -TERM "$pid"
          wait "$pid"
          if curl --fail --silent --max-time 3 'http://127.0.0.1:8456/health'; then
            echo 'Companion outlived Mebooru' >&2
            exit 1
          fi
      - name: Verify first-party pairing and refusal paths
        if: runner.os == 'macOS'
        run: python .github/qa/bundled-pairing-smoke.py dist/Mebooru.app

  go-validation:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: Both modules (race, vet and strict transfer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            meloader/go.sum
            shared/go.sum
      - name: Shared module race and vet
        working-directory: shared
        run: |
          go test -race -timeout 30m ./...
          go vet ./...
      - name: Mebooru race and vet
        run: |
          go test -race -timeout 30m ./...
          go vet ./...
      - name: Meloader race and vet
        working-directory: meloader
        run: |
          go test -race -timeout 30m ./...
          go vet ./...
      - name: Strict download regression with pinned gallery-dl
        working-directory: meloader
        shell: bash
        run: |
          source packaging/pins.env
          venv="$RUNNER_TEMP/meloader-strict-gallery-dl"
          python3 -m venv "$venv"
          "$venv/bin/python3" -m pip install --disable-pip-version-check "gallery-dl==$GDL_VERSION"
          test "$("$venv/bin/gallery-dl" --version)" = "$GDL_VERSION"
          MELOADER_STRICT_TEST_GDL="$venv/bin/gallery-dl" \
            go test -race -count=1 -timeout=3m -v \
              -run '^TestStrictBlacklistGalleryDLMediaBoundary$' ./internal/pipeline

  container-build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: Container build stage (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: library
            file: docker/Dockerfile
          - app: acquisition
            file: meloader/docker/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile container build stage without publishing
        run: docker build --target build -f '${{ matrix.file }}' .
